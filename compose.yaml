services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: os_a2z
      POSTGRES_USER: os_a2z
      POSTGRES_PASSWORD: os_a2z_dev_only
    ports:
      - "5432:5432"
    volumes:
      - os_a2z_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os_a2z -d os_a2z"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5175,http://localhost:5175}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://os_a2z:os_a2z_dev_only@db:5432/os_a2z}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-os-a2z-linux-sandbox:latest}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-auto}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  os_a2z_db:
